name: smartbnb
version: "1.0.0"
config-version: 2
profile: smartbnb

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "logs"]

# The business rules of the pipeline, in one place. data/db/quality.py reads
# the nightly price range from here too, for its audit.
vars:
  # CHF. A scraped price below this is a parsing error, and a scrape whose
  # median is below it shipped a broken price column (mid-2026 Inside Airbnb
  # files had every price below 1 CHF): stg_snapshots drops those prices.
  min_plausible_price: 5
  # CHF. Nightly prices outside this range are not used for the current
  # price: below 20 it is e.g. a monthly rent spread over the minimum stay.
  min_nightly_price: 20
  max_nightly_price: 5000
  # A listing's current price must be seen in the months before the newest price
  price_window_months: 6
  # Neighbourhood baselines use the scrapes and prices of these last months
  # (data/db/pipeline.py --stats-months overrides it)
  stats_window_months: 3
  # Price trends: first priced scrape of this window against the latest
  trend_window_months: 12
  # A new price series starts when the median price change of the same
  # listings between two consecutive priced scrapes is above this ratio or
  # below its inverse: Inside Airbnb changed its price definition. A normal
  # step moves the median listing by about 1%, the March 2026 one by 34%.
  price_break_ratio: 1.25
  # A district's trend needs at least this many listings priced at both dates
  min_trend_listings: 20
  # A listing is active (still on Airbnb) when it is in one of the last
  # active_scrapes scrapes. 1 would be exact, but a single partial file
  # (2026-01-15 had 3,851 rows instead of about 5,500) would then mark
  # thousands of real listings as gone; 2 keeps a listing that left for one
  # more month at most.
  active_scrapes: 2

models:
  smartbnb:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    # Built as tables in the build schema, then copied into public by
    # data/db/publish.py once every test and the audit pass
    marts:
      +materialized: table
