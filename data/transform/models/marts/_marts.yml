version: 2

# The tables the site reads. They keep the names and columns of the public
# tables (data/db/schema.sql), into which data/db/publish.py copies them.
models:
  - name: current_prices
    description: >
      Latest plausible nightly price of each listing, from the Inside Airbnb
      scrapes or the price scraper, whichever saw it last, if seen in the
      price_window_months before the newest price. The price map, the price
      ranking and the score's price part use it.
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_active_listings')
                field: listing_id
      - name: price
        description: Nightly price in CHF.
        data_tests:
          - not_null
          - in_range:
              arguments:
                min_value: "{{ var('min_nightly_price') }}"
                max_value: "{{ var('max_nightly_price') }}"
      - name: price_date
        description: Day the price was seen.
        data_tests: [not_null]
      - name: source
        description: >
          Which of the three price definitions the price comes from:
          insideairbnb, scrape_search or scrape_listing (see int_listing_prices).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["insideairbnb", "scrape_search", "scrape_listing"]

  - name: airbnb_points
    description: Amenities score of each listing, the sum of the weights of its amenity categories.
    columns:
      - name: airbnb_id
        description: Airbnb listing id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_listings')
                field: listing_id
      - name: total_points
        description: Sum of the weights (data/db/seed.sql) of the listing's amenity categories.
        data_tests: [not_null]

  - name: price_baselines
    description: >
      The prices each active listing's price is compared with: the average
      and median current price of the listings of the same room type and
      capacity band, in the neighbourhood when it has at least
      min_price_comparables of them, else in the district, else in the
      canton (the largest sample when no level has enough). Prices seen in
      the last stats_window_months, one per listing.
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_active_listings')
                field: listing_id
      - name: level
        description: Where the similar listings are, neighbourhood, district or canton.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["neighbourhood", "district", "canton"]
      - name: area
        description: Name of the neighbourhood or district, or Vaud for the canton.
        data_tests: [not_null]
      - name: capacity_band
        description: Guests the listing hosts, 1-2, 3-4, 5-6, 7+ (or unknown).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1-2", "3-4", "5-6", "7+", "unknown"]
      - name: avg_price
        description: Mean nightly price in CHF of the similar listings.
      - name: median_price
        description: Median nightly price in CHF of the similar listings.
        data_tests:
          - not_null
          - in_range:
              arguments:
                min_value: "{{ var('min_nightly_price') }}"
                max_value: "{{ var('max_nightly_price') }}"
      - name: n_listings
        description: Number of similar listings behind the median (the sample size).
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 1, max_value: 100000}

  - name: neighbourhood_stats
    description: >
      Review baselines per neighbourhood, one row per listing seen in the
      last stats_window_months (its latest snapshot), measured the same way
      as the listing they are compared with.
    columns:
      - name: neighbourhood
        data_tests: [unique, not_null]
      - name: avg_rating
        description: >
          Mean overall rating (review_scores_rating, 1 to 5) of the listings
          that have one; a listing without review has no rating and is left
          out. The site shows it next to the listing's overall rating.
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 5}
      - name: avg_reviews_per_month
        description: >
          Mean reviews_per_month, a listing with no review counting as 0 (as
          on the listing side of the score). The baseline of the score's
          reviews part.
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0, max_value: 1000}
      - name: n_listings
        description: Number of listings behind avg_reviews_per_month (the sample size).
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 1, max_value: 100000}
      - name: n_rated_listings
        description: Number of listings behind avg_rating (those with a rating).
        data_tests: [not_null]

  - name: price_trends
    description: >
      "Price trends" on the site: per district, the median price change of
      the listings priced both in the first priced scrape of the last
      trend_window_months and in the latest one. A change of price
      definition by Inside Airbnb (the same listings moving by more than
      price_break_ratio in one step) starts a new series, and the trend
      never compares across it. Districts with fewer than min_trend_listings
      such listings are left out. Empty when the current series has a
      single priced scrape.
    columns:
      - name: region
        description: District (Inside Airbnb neighbourhood_group_cleansed), or Unknown.
        data_tests: [unique, not_null]
      - name: start_date
        description: Day of the first scrape compared.
        data_tests: [not_null]
      - name: end_date
        description: Day of the latest scrape compared.
        data_tests: [not_null]
      - name: n_listings
        description: Listings priced at both dates, behind pct (the sample size).
        data_tests:
          - not_null
          - in_range:
              arguments:
                min_value: "{{ var('min_trend_listings') }}"
                max_value: 100000
      - name: pct
        description: Median of the listings' own price changes, in percent.
        data_tests: [not_null]

  - name: listing_activity
    description: >
      Lifetime of each listing on Airbnb. A listing is active when it is in
      one of the last active_scrapes scrapes (2): exact enough, and a single
      partial file does not mark real listings as gone. The site does not
      score a listing that is not active, and no statistic of the current
      market counts it.
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_listings')
                field: listing_id
      - name: first_seen
        description: Day of the listing's first scrape.
        data_tests: [not_null]
      - name: last_seen
        description: Day of the listing's latest scrape.
        data_tests: [not_null]
      - name: last_scrape_id
        description: Scrape id of the listing's latest snapshot.
        data_tests: [not_null]
      - name: scrapes_seen
        description: Number of scrapes the listing appears in.
        data_tests: [not_null]
      - name: is_active
        description: In one of the last active_scrapes scrapes, so presumably still on Airbnb.
        data_tests: [not_null]

unit_tests:
  - name: a_price_is_compared_as_locally_as_the_data_allows
    description: >
      With min_price_comparables at 2: listing 1 has 2 similar listings in
      its neighbourhood (itself and 2), so it is compared there; listing 3,
      alone in its neighbourhood, falls back to its district (listings 1, 2,
      3); listing 5 hosts more guests, so it is compared with the other large
      home only (listing 6, another district): only the canton has enough
      listings. The hotel room (7) has no similar listing anywhere: it gets
      the largest sample, the canton, flagged by its n_listings of 1. A
      listing without a price (4) is compared too.
    model: price_baselines
    overrides:
      vars: {min_price_comparables: 2}
    given:
      - input: ref('int_active_listings')
        rows:
          - {listing_id: 1, neighbourhood: "Montreux", neighbourhood_group: "Riviera", room_type: "Entire home/apt", accommodates: 2}
          - {listing_id: 2, neighbourhood: "Montreux", neighbourhood_group: "Riviera", room_type: "Entire home/apt", accommodates: 1}
          - {listing_id: 3, neighbourhood: "Vevey", neighbourhood_group: "Riviera", room_type: "Entire home/apt", accommodates: 2}
          - {listing_id: 4, neighbourhood: "Vevey", neighbourhood_group: "Riviera", room_type: "Entire home/apt", accommodates: 2}
          - {listing_id: 5, neighbourhood: "Vevey", neighbourhood_group: "Riviera", room_type: "Entire home/apt", accommodates: 6}
          - {listing_id: 6, neighbourhood: "Nyon", neighbourhood_group: "Nyon", room_type: "Entire home/apt", accommodates: 5}
          - {listing_id: 7, neighbourhood: "Montreux", neighbourhood_group: "Riviera", room_type: "Hotel room", accommodates: 2}
      - input: ref('current_prices')
        rows:
          - {listing_id: 1, price: 100, price_date: "2026-09-10"}
          - {listing_id: 2, price: 120, price_date: "2026-09-10"}
          - {listing_id: 3, price: 140, price_date: "2026-09-10"}
          - {listing_id: 5, price: 300, price_date: "2026-09-10"}
          - {listing_id: 6, price: 400, price_date: "2026-09-10"}
          - {listing_id: 7, price: 200, price_date: "2026-09-10"}
    expect:
      rows:
        - {listing_id: 1, level: "neighbourhood", area: "Montreux", capacity_band: "1-2", median_price: 110, n_listings: 2}
        - {listing_id: 2, level: "neighbourhood", area: "Montreux", capacity_band: "1-2", median_price: 110, n_listings: 2}
        - {listing_id: 3, level: "district", area: "Riviera", capacity_band: "1-2", median_price: 120, n_listings: 3}
        - {listing_id: 4, level: "district", area: "Riviera", capacity_band: "1-2", median_price: 120, n_listings: 3}
        - {listing_id: 5, level: "canton", area: "Vaud", capacity_band: "5-6", median_price: 350, n_listings: 2}
        - {listing_id: 6, level: "canton", area: "Vaud", capacity_band: "5-6", median_price: 350, n_listings: 2}
        - {listing_id: 7, level: "canton", area: "Vaud", capacity_band: "1-2", median_price: 200, n_listings: 1}

  - name: price_trends_do_not_cross_a_price_definition_change
    description: >
      Between the first two scrapes every price goes up by 60%: Inside
      Airbnb changed its price definition, so the trend starts at the second
      scrape. It is the median of the changes of the listings priced at both
      dates (0%, +12.5%, +25%): a listing without a price at the start or
      that joined later does not count, and a district with fewer than
      min_trend_listings listings is left out.
    model: price_trends
    overrides:
      vars: {min_trend_listings: 2}
    given:
      - input: ref('stg_snapshots')
        rows:
          - {listing_id: 1, scrape_id: 100, last_scraped: "2025-11-01", price: 100}
          - {listing_id: 1, scrape_id: 200, last_scraped: "2026-03-16", price: 160}
          - {listing_id: 1, scrape_id: 300, last_scraped: "2026-09-14", price: 160}
          - {listing_id: 2, scrape_id: 100, last_scraped: "2025-11-01", price: 100}
          - {listing_id: 2, scrape_id: 200, last_scraped: "2026-03-16", price: 160}
          - {listing_id: 2, scrape_id: 300, last_scraped: "2026-09-14", price: 180}
          - {listing_id: 3, scrape_id: 100, last_scraped: "2025-11-01", price: 100}
          - {listing_id: 3, scrape_id: 200, last_scraped: "2026-03-16", price: 160}
          - {listing_id: 3, scrape_id: 300, last_scraped: "2026-09-14", price: 200}
          - {listing_id: 4, scrape_id: 200, last_scraped: "2026-03-16", price: null}
          - {listing_id: 4, scrape_id: 300, last_scraped: "2026-09-14", price: 900}
          - {listing_id: 5, scrape_id: 300, last_scraped: "2026-09-14", price: 20}
          - {listing_id: 6, scrape_id: 100, last_scraped: "2025-11-01", price: 100}
          - {listing_id: 6, scrape_id: 200, last_scraped: "2026-03-16", price: 160}
          - {listing_id: 6, scrape_id: 300, last_scraped: "2026-09-14", price: 170}
      - input: ref('stg_listings')
        rows:
          - {listing_id: 1, neighbourhood_group: "Lausanne"}
          - {listing_id: 2, neighbourhood_group: "Lausanne"}
          - {listing_id: 3, neighbourhood_group: "Lausanne"}
          - {listing_id: 4, neighbourhood_group: "Lausanne"}
          - {listing_id: 5, neighbourhood_group: "Lausanne"}
          - {listing_id: 6, neighbourhood_group: "Nyon"}
    expect:
      rows:
        - {region: "Lausanne", start_date: "2026-03-16", end_date: "2026-09-14", n_listings: 3, pct: 12.5}

  - name: a_listing_is_active_until_it_misses_two_scrapes
    description: >
      Three scrapes, the latest one partial. A listing in every scrape is
      active; a listing missing only from the partial scrape stays active;
      a listing only in the first scrape has left; a new listing is active
      from its first scrape.
    model: listing_activity
    given:
      - input: ref('stg_snapshots')
        rows:
          - {listing_id: 1, scrape_id: 100, last_scraped: "2026-07-10"}
          - {listing_id: 1, scrape_id: 200, last_scraped: "2026-08-10"}
          - {listing_id: 1, scrape_id: 300, last_scraped: "2026-09-10"}
          - {listing_id: 2, scrape_id: 100, last_scraped: "2026-07-10"}
          - {listing_id: 2, scrape_id: 200, last_scraped: "2026-08-10"}
          - {listing_id: 3, scrape_id: 100, last_scraped: "2026-07-10"}
          - {listing_id: 4, scrape_id: 300, last_scraped: "2026-09-10"}
    expect:
      rows:
        - {listing_id: 1, first_seen: "2026-07-10", last_seen: "2026-09-10", scrapes_seen: 3, is_active: true}
        - {listing_id: 2, first_seen: "2026-07-10", last_seen: "2026-08-10", scrapes_seen: 2, is_active: true}
        - {listing_id: 3, first_seen: "2026-07-10", last_seen: "2026-07-10", scrapes_seen: 1, is_active: false}
        - {listing_id: 4, first_seen: "2026-09-10", last_seen: "2026-09-10", scrapes_seen: 1, is_active: true}

  - name: a_listing_without_review_counts_as_zero
    description: >
      A listing with no review lowers the reviews baseline as a 0 (the value
      its own reviews part uses) and is left out of the rating baseline;
      listings without a neighbourhood are left out of both.
    model: neighbourhood_stats
    given:
      - input: ref('int_listing_latest_snapshots')
        rows:
          - {listing_id: 1, number_of_reviews: 50, reviews_per_month: 2.0, review_scores_rating: 4.8}
          - {listing_id: 2, number_of_reviews: 0, reviews_per_month: null, review_scores_rating: null}
          - {listing_id: 3, number_of_reviews: 10, reviews_per_month: 1.0, review_scores_rating: 4.0}
      - input: ref('int_active_listings')
        rows:
          - {listing_id: 1, neighbourhood: "Lausanne"}
          - {listing_id: 2, neighbourhood: "Lausanne"}
          - {listing_id: 3, neighbourhood: null}
    expect:
      rows:
        - {neighbourhood: "Lausanne", avg_rating: 4.8, avg_reviews_per_month: 1.0, n_listings: 2, n_rated_listings: 1}

  - name: current_price_is_the_latest_in_the_window
    description: >
      A listing gets its newest price and its source; a price older than
      price_window_months before the newest price overall is too old; on a
      same-day tie the Inside Airbnb price wins; a listing we do not know
      gets none.
    model: current_prices
    given:
      - input: ref('int_listing_prices')
        rows:
          - {listing_id: 1, price: 100, price_date: "2026-01-01", source: insideairbnb}
          - {listing_id: 1, price: 150, price_date: "2026-09-01", source: scrape_search}
          - {listing_id: 2, price: 90, price_date: "2026-01-15", source: insideairbnb}
          - {listing_id: 3, price: 80, price_date: "2026-08-01", source: insideairbnb}
          - {listing_id: 3, price: 85, price_date: "2026-08-01", source: scrape_listing}
          - {listing_id: 4, price: 70, price_date: "2026-09-01", source: insideairbnb}
      - input: ref('int_active_listings')
        rows:
          - {listing_id: 1}
          - {listing_id: 2}
          - {listing_id: 3}
    expect:
      rows:
        - {listing_id: 1, price: 150, price_date: "2026-09-01", source: scrape_search}
        - {listing_id: 3, price: 80, price_date: "2026-08-01", source: insideairbnb}
