name: PR to develop

on:
  pull_request:
    branches: ["develop", "main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    # Tests mock the database and the AI, so they need no secrets
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE || '/api' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smartbnb/frontend/package-lock.json
            smartbnb/backend/package-lock.json

      # Frontend
      - name: Install FE
        working-directory: smartbnb/frontend
        run: npm ci

      - name: Lint FE
        working-directory: smartbnb/frontend
        run: npm run lint --if-present

      - name: Build FE
        working-directory: smartbnb/frontend
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}
        run: npm run build

      # Backend
      - name: Install BE
        working-directory: smartbnb/backend
        run: npm ci

      - name: Lint BE
        working-directory: smartbnb/backend
        run: npm run lint --if-present

      - name: Test BE
        working-directory: smartbnb/backend
        run: npm test --if-present
