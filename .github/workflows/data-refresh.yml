name: Data refresh

# Weekly run of the data pipeline (data/db/pipeline.py, Write-Audit-Publish):
# download the newest Inside Airbnb snapshot, load it into the build schema,
# transform it with dbt (data/transform) and run the dbt tests, then publish
# it into public and audit it (data/db/quality.py) in one transaction that is
# committed only if no blocking check fails. Each run is logged in etl_runs.
#
# The run fails, and GitHub emails the repository owner, when the load is
# blocked or crashes, and also when it is published with warnings.
# A new snapshot file is committed to the private SmartBnB-data repository,
# never to this public one. Details: docs/operations.md.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Snapshot archive, through a deploy key that can only write to that
      # repository (secret SNAPSHOTS_DEPLOY_KEY)
      - name: Checkout the snapshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/SmartBnB-data
          ssh-key: ${{ secrets.SNAPSHOTS_DEPLOY_KEY }}
          path: data/snapshots

      # smartbnb_loader role (data/db/roles.sql): it builds in the build
      # schema and refills the listing and stats tables, it cannot drop them
      # nor touch the collected prices
      - name: Load, transform, audit and publish
        id: load
        env:
          DATABASE_URL: ${{ secrets.LOADER_DATABASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::The LOADER_DATABASE_URL secret is not set"
            exit 1
          fi
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r data/db/requirements.txt
          /tmp/venv/bin/python data/db/pipeline.py --fetch --trigger github-actions 2>&1 | tee load.log
          code=${PIPESTATUS[0]}
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo "### Data refresh"
            echo '```'
            # One line per dbt node is too much for the summary: keep dbt's totals
            grep -v -E 'csv.gz: |[0-9]+ of [0-9]+ (START|PASS|OK) ' load.log | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 published, 2 published with warnings, anything else blocked or failed
          [ "${code}" = 0 ] || [ "${code}" = 2 ]

      - name: Archive the new snapshot
        if: steps.load.outcome == 'success'
        working-directory: data/snapshots
        run: |
          set -euo pipefail
          new=$(git status --porcelain -- '*.csv.gz' | awk '{print $2}')
          if [ -z "${new}" ]; then
            echo "No new snapshot to archive"
            exit 0
          fi
          date=$(basename "$(echo "${new}" | head -1)" .csv.gz)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ${new}
          git commit -m "chore: add the ${date} Inside Airbnb snapshot"
          git push origin HEAD
          echo "Snapshot ${date} archived in SmartBnB-data" >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on warnings
        if: steps.load.outputs.code == '2'
        run: |
          echo "::error::The data was published with warnings, see the run summary"
          exit 1
