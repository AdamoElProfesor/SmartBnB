name: CI

# Runs on every pull request to main and on main itself. "Build + Tests" is the
# required check of the protected main branch, and Render deploys main only
# once it passes. Tests mock the database and the AI, so they need no secrets.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smartbnb/frontend/package-lock.json
            smartbnb/backend/package-lock.json

      - name: Lint, test and build frontend
        working-directory: smartbnb/frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Test backend
        working-directory: smartbnb/backend
        run: |
          npm ci
          npm test
