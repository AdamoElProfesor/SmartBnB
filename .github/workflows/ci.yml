name: CI

# Runs on every pull request to main and on main itself. "Build + Tests" is the
# required check of the protected main branch, and Render deploys main only
# once it passes. The app tests mock the database and the AI. The backend
# queries and the data pipeline also run, on small or synthetic data, in a
# throwaway Postgres: no secret needed.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + Tests
    runs-on: ubuntu-latest

    # Throwaway Postgres for the backend queries and the end-to-end run of the
    # data pipeline
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smartbnb/frontend/package-lock.json
            smartbnb/backend/package-lock.json

      - name: Lint, test and build frontend
        working-directory: smartbnb/frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Test backend
        working-directory: smartbnb/backend
        run: |
          npm ci
          npm test

      # Every repository query against a real Postgres, in a database of its
      # own so the pipeline run below starts from an empty one. The tests
      # rebuild it from data/db/schema.sql, seed.sql and a small fixture.
      - name: Test the backend queries against Postgres
        working-directory: smartbnb/backend
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backend_it
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE backend_it"
          npm run test:integration

      # Data pipeline lint (data/ruff.toml) and tests (no database needed),
      # then no snapshot may be committed here: they belong to the private
      # SmartBnB-data repository, since the Inside Airbnb data policies ask
      # not to republish the data
      - name: Test the data pipeline and check no snapshot is published
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r data/db/requirements-dev.txt
          /tmp/venv/bin/ruff check data
          (cd data/db && /tmp/venv/bin/python -m pytest -q)
          published=$(git ls-files '*.csv.gz' '*.csv')
          if [ -n "${published}" ]; then
            echo "::error::Data files must not be committed to this public repository: ${published}"
            exit 1
          fi

      # The whole pipeline (extract-load, dbt build, publish, audit) on
      # synthetic snapshots and the throwaway Postgres: it must publish, and a
      # second run with no new file must change nothing (idempotence)
      - name: Run the data pipeline end to end
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: /tmp/venv/bin/python data/db/tests/e2e_pipeline.py

      # Data dictionary and lineage graph of the dbt models, as one HTML page
      # (download it from the run's artifacts)
      - name: Generate the dbt docs
        env:
          DBT_HOST: localhost
          DBT_USER: postgres
          DBT_PASSWORD: postgres
        run: /tmp/venv/bin/dbt docs generate --static --project-dir data/transform --profiles-dir data/transform

      - name: Upload the dbt docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbt-docs
          path: data/transform/target/static_index.html
          retention-days: 30
          if-no-files-found: error
