name: CI

# Runs on every pull request to main and on main itself. "Build + Tests" is the
# required check of the protected main branch, and Render deploys main only
# once it passes. Tests mock the database and the AI, so they need no secrets.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smartbnb/frontend/package-lock.json
            smartbnb/backend/package-lock.json

      - name: Lint, test and build frontend
        working-directory: smartbnb/frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Test backend
        working-directory: smartbnb/backend
        run: |
          npm ci
          npm test

      # data/ is public: every snapshot must hold only the columns the
      # loader uses (PUBLISHED_COLS), never host names or host texts
      - name: Check the published snapshots
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r data/db/requirements.txt
          /tmp/venv/bin/python data/db/load_data.py --check
