name: CI

# Runs on every pull request to main and on main itself. "Build + Tests" is the
# required check of the protected main branch, and Render deploys main only
# once it passes. Tests mock the database and the AI, so they need no secrets.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smartbnb/frontend/package-lock.json
            smartbnb/backend/package-lock.json

      - name: Lint, test and build frontend
        working-directory: smartbnb/frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Test backend
        working-directory: smartbnb/backend
        run: |
          npm ci
          npm test

      # Data pipeline tests (no database needed), then no snapshot may be
      # committed here: they belong to the private SmartBnB-data repository,
      # since the Inside Airbnb data policies ask not to republish the data
      - name: Test the data pipeline and check no snapshot is published
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r data/db/requirements-dev.txt
          (cd data/db && /tmp/venv/bin/python -m pytest -q)
          published=$(git ls-files '*.csv.gz' '*.csv')
          if [ -n "${published}" ]; then
            echo "::error::Data files must not be committed to this public repository: ${published}"
            exit 1
          fi
