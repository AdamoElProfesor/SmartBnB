name: Feature idea
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation or frustration, not only the solution.
      placeholder: When I check a listing on my phone, I cannot share the result with a friend.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      placeholder: A link like smartbnb.ch/?listing=53584592 that opens the result directly.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
